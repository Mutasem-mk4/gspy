name: Installed Linux user journey
on:
  workflow_dispatch:
    inputs:
      gspy_ref:
        default: '498991b785015338091f3f1ccab9fd5594fed0f1'
        required: true
      gspy_package_run:
        default: '37123591567'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Mutasem-mk4/gspy
          ref: ${{ inputs.gspy_ref }}
          path: gspy-source
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: Mutasem-mk4/mcpwn-red
          ref: 'a0e4e9755f334e8619b90f259fe8d244f337efb4'
          path: mcpwn-red-source
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.8'
      - name: Download the already validated installable packages
        env:
          GH_TOKEN: ${{ github.token }}
          GSPY_PACKAGE_RUN: ${{ inputs.gspy_package_run }}
        run: |
          gh run download "$GSPY_PACKAGE_RUN" --repo Mutasem-mk4/gspy --name gspy-debian --dir packages/gspy
          gh run download 37123701677 --repo Mutasem-mk4/procscope --name procscope-deb --dir packages/procscope
      - name: Install as an ordinary Linux user would
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip clang llvm libbpf-dev libelf-dev
          sudo apt-get install -y ./packages/gspy/*.deb ./packages/procscope/*.deb
          python3 -m venv mcp-env
          mcp-env/bin/pip install ./mcpwn-red-source pyte==0.8.2
          git clone https://gitlab.com/parrotsec/project/mcpwn.git mcpwn-source
          git -C mcpwn-source checkout a5d0bbb4e2ec2f0e27404543e67f825fb98bad4e
          cd mcpwn-source
          go build -o ../mcpwn ./cmd/mcpwn
      - name: Follow installed CLI and README user journeys in real terminals
        run: mcp-env/bin/python qa/user_journey.py --out journey-results
      - name: Make root-owned evidence collectable without changing privacy modes
        if: always()
        run: |
          if [ -d journey-results ]; then
            sudo chown -R "$(id -u):$(id -g)" journey-results
          fi
      - name: Collect user-visible transcripts and terminal screens
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-user-journey
          path: journey-results/
